[project]
name = "ai-engineer-bootcamp"
version = "0.1.0"
requires-python = ">=3.12"
# Versions checked on PyPI 2026-11-05
dependencies = [
  "anthropic>=2.6,<3",
  "openai>=3.46,<4",
  "google-genai>=2.34,<3",
  "ollama>=0.6.3,<0.7",
  "tiktoken>=0.14",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
