[project]
name = "ai-engineer-bootcamp"
version = "0.1.0"
requires-python = ">=3.12"
# Versions checked on PyPI 2026-11-05
dependencies = [
  "anthropic>=2.6,<3",
  "openai>=3.46,<4",
  "google-genai>=2.34,<3",
  "ollama>=0.6.3,<0.7",
  "tiktoken>=0.14",
  "python-dotenv>=1.0",
  # S22b MCP & Modern Agents (checked on PyPI 2026-11-20)
  "langchain[mcp]>=1.5,<1.6",
  "langchain-anthropic>=1.7,<2",
  "langgraph>=1.2.24,<1.3",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=2.3,<3",  # security floor is 2.2.0
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
